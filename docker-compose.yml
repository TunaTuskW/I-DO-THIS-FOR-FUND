
services:
  backend:
    build: .
    container_name: quant_backend
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./models:/app/models
      - ./src:/app/src
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: quant_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  fundamental_agent:
    build: 
      context: .
      dockerfile: Dockerfile.fundamental
    container_name: fundamental_agent
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    restart: always

volumes:
  quant_models:
